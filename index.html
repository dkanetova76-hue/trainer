const app = document.getElementById("app");
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
const pct = x => Math.round(x * 100);
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
const variance = a => { if (a.length < 2) return 0; const m = mean(a); return a.reduce((s, x) => s + (x - m) * (x - m), 0) / (a.length - 1); };
const median = a => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function pearson(x, y){
  const n = x.length; if (n < 3) return null;
  const mx = mean(x), my = mean(y); let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++){ const a = x[i] - mx, b = y[i] - my; sxy += a * b; sxx += a * a; syy += b * b; }
  return (sxx && syy) ? sxy / Math.sqrt(sxx * syy) : null;
}
function shuffle(a, seed){ const r = a.slice(); let s = seed || 1; for (let i = r.length - 1; i > 0; i--){ s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function bloomTag(b){ return h("span", {class:"tag bl", style:`background:var(--b${b})`}, `Блум ${b} · ${BLOOM[b]}`); }
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };

const fmt2 = x => x == null ? "—" : x.toFixed(2).replace(".", ",");

function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code:"timeout"}), ms))]); }

/* ---------- attempt ---------- */
let att = null;
function pickQuestions(ch, seed){
  const bank = BANK[ch], k = PER_TEST[ch];
  if (!k || k >= bank.length) return bank.slice();
  const byRo = {}; bank.forEach(q => (byRo[q.ro] = byRo[q.ro] || []).push(q));
  const ros = Object.keys(byRo), picked = [];
  ros.forEach((r, i) => { const share = Math.max(1, Math.round(k * byRo[r].length / bank.length)); picked.push(...shuffle(byRo[r], seed + i).slice(0, share)); });
  return bank.filter(q => picked.slice(0, k).includes(q));
}
function startAttempt(ch, mode){
  const seed = Date.now() % 100000;
  const prefs = store.get("trainer-prefs") || {};
  att = { ch, mode, seed, i:0, ans:{}, conf:{}, time:{}, checked:{}, touched:{}, done:false, saved:null,
    uni: prefs.uni || "", group: prefs.group || "",
    qs: pickQuestions(ch, seed).map((q, k) => Object.assign({}, q, {
      _opts: q.opts ? shuffle(q.opts, seed + k) : null,
      _choices: q.type === "match" ? shuffle(q.choices || [...new Set(q.items.map(p => p[1]))], seed + k + 3) : null
    })) };
  att.qs.forEach((q, k) => { if (q.type === "order") att.ans[q.id] = shuffle(q.items.map((_, j) => j), seed + k + 7); });
  att.tId = null;
}
function leaveQ(){ if (att && att.tId && !att.done){ att.time[att.tId] = (att.time[att.tId] || 0) + (Date.now() - att.tShown) / 1000; att.tId = null; } }
function go(i){ leaveQ(); att.i = i; render(); }

function grade(q, a){
  if (a == null) return 0;
  if (q.type === "single" || q.type === "case" || q.type === "hotspot") return a === q.correct ? 1 : 0;
  if (q.type === "multi"){ const sel = new Set(a), cor = new Set(q.correct); let hit = 0, wrong = 0; sel.forEach(x => cor.has(x) ? hit++ : wrong++); return Math.max(0, (hit - wrong) / cor.size); }
  if (q.type === "match"){ let ok = 0; q.items.forEach((p, j) => { if (a[j] === p[1]) ok++; }); return ok / q.items.length; }
  if (q.type === "order"){ let ok = 0; a.forEach((v, pos) => { if (v === pos) ok++; }); return ok / a.length; }
  return 0;
}
function hasAnswer(q){
  const a = att.ans[q.id];
  if (q.type === "order") return !!att.touched[q.id];
  if (q.type === "multi") return !!(a && a.length);
  if (q.type === "match") return !!(a && q.items.every((_, j) => a[j]));
  return a != null;
}
const answered = q => hasAnswer(q) && !!att.conf[q.id];
const cbmPoints = (f, c) => c ? (f === 1 ? CBM[c][0] : CBM[c][1]) : 0;

      h("p", null, `Не готово заданий: ${left} (нет ответа или отметки уверенности). Пропущенные задания засчитываются как неверные.`),

  const t = {ch: att.ch, at: new Date().toISOString(), mode: att.mode, uni: att.uni, group: att.group, score: att.score,
    cbm: Math.round(att.cbmAvg * 100) / 100, qids: att.qs.map(q => q.id), items: att.items, resp, conf, time};

}

    const d = pearson(rows.map(r => r[0]), rows.map(r => r[1]));
    let cw = 0, nc = 0; const times = [];
    first.forEach(t => { const c = t.conf && t.conf[q.id], f = t.items && t.items[q.id]; if (c){ nc++; if (c >= 2 && f !== 1) cw++; } if (t.time && t.time[q.id] != null) times.push(t.time[q.id]); });
    return {q, j, n: rows.length, p, d, cw: nc ? cw / nc : 0, tmed: median(times), fast: times.filter(x => x < 5).length};
  });
  let alpha = null;
  if (complete.length >= 3){
    const k = qs.length, iv = qs.map((_, j) => variance(complete.map(r => r[j]))), tv = variance(complete.map(r => r.reduce((s, v) => s + v, 0)));
    alpha = tv ? (k / (k - 1)) * (1 - iv.reduce((s, x) => s + x, 0) / tv) : null;
  }
  const avgScore = mean(first.map(t => t.score)), passed = first.filter(t => t.score >= pass).length, avgCbm = mean(first.map(t => t.cbm || 0));
  const qd = emptyQuad(); first.forEach(t => qs.forEach(q => addQuad(qd, t.items ? t.items[q.id] : 0, t.conf ? t.conf[q.id] : null)));
  const nconf = qd.cc + qd.uc + qd.cw + qd.uw;
  const agg = key => { const m = {}; itemStats.forEach(s => { if (s.p == null) return; const k = s.q[key]; (m[k] = m[k] || {s:0, n:0}); m[k].s += s.p; m[k].n++; }); return m; };
  const byRo = agg("ro"), byBl = agg("bloom");
  const alphaTxt = alpha == null ? "недостаточно данных" : alpha >= .8 ? "достаточно для итогового контроля" : alpha >= .7 ? "достаточно для текущего контроля" : "низкая: пересмотрите слабые задания";
  box.append(...[
    h("div", {class:"kpis"},
      h("div", {class:"kpi"}, h("strong", null, String(N)), h("span", null, "студентов")),
      h("div", {class:"kpi"}, h("strong", null, `${Math.round(avgScore)}%`), h("span", null, "средний результат первой попытки")),
      h("div", {class:"kpi"}, h("strong", null, `${passed} / ${N}`), h("span", null, `набрали проходной балл ${pass}%`)),
      h("div", {class:"kpi"}, h("strong", null, fmt1(avgCbm)), h("span", null, "средний балл уверенности, из 3")),
      h("div", {class:"kpi" + (alpha != null && alpha < .7 ? " warn" : "")}, h("strong", null, fmt2(alpha)), h("span", null, `надёжность (альфа Кронбаха): ${alphaTxt}`))),
    N < 30 ? h("div", {class:"note"}, `Студентов пока ${N}. Показатели трудности, различающей способности и надёжности становятся устойчивыми примерно от 30 человек; сейчас считайте их предварительными.`) : null,
    h("div", {class:"card"}, h("h2", null, "Освоение результатов обучения"), h("div", {class:"bars"}, Object.keys(RO).filter(k => byRo[k]).map(k => barRow(RO[k], `РО ${k}`, byRo[k].s / byRo[k].n)))),
    h("div", {class:"card"}, h("h2", null, "По уровням Блума"), h("div", {class:"bars"}, [1,2,3,4,5,6].filter(b => byBl[b]).map(b => barRow(BLOOM[b], String(b), byBl[b].s / byBl[b].n)))),
    h("div", {class:"card"}, h("h2", null, "Уверенность группы"),
      h("p", {class:"hint"}, "Уверенные ошибки — ложные представления, общие для группы. Их стоит разобрать на занятии в первую очередь."),
      quadBlock(qd, nconf), h("h3", null, "Калибровка группы"), calibration(qd)),
    itemCard(itemStats, first),
    studentsCard(bySid, pass),
    angoffCard(ch, cfg, itemStats, box)
  ].filter(Boolean));
}

function itemCard(stats, first){
  const flags = s => { const f = [];
    if (s.p != null && s.p > .9) f.push(["easy", "лёгкое"]); if (s.p != null && s.p < .3) f.push(["hard", "трудное"]);
    if (s.d != null && s.d < 0) f.push(["key", "проверьте ключ"]); else if (s.d != null && s.d < .2) f.push(["lowd", "слабо различает"]);
    if (s.cw > .3) f.push(["cw", "ложное представление"]);
    if (!f.length) f.push(["okk", "норма"]); return h("div", {class:"flags"}, f.map(([c, t]) => h("span", {class:"flag " + c}, t))); };
  return h("div", {class:"card"}, h("h2", null, "Качество заданий"),
    h("p", {class:"hint"}, "Трудность — средний балл за задание (норма 0,30–0,90). Различающая способность — корреляция задания с остальным тестом: от 0,30 хорошо, ниже 0,20 задание стоит переработать, отрицательная почти всегда означает ошибку в ключе. «Уверенные ошибки» — доля ответов, данных с уверенностью 2–3 и оказавшихся неверными."),
    h("div", {class:"tbl"}, h("table", null,
      h("thead", null, h("tr", null, h("th", null, "№"), h("th", null, "Тип · РО · Блум"), h("th", {class:"num"}, "Трудн."), h("th", {class:"num"}, "Различ."), h("th", {class:"num"}, "Увер. ош."), h("th", {class:"num"}, "Время, с"), h("th", null, "Оценка"))),
      h("tbody", null, stats.map(s => h("tr", null, h("td", null, s.j + 1), h("td", null, `${TYPES[s.q.type]} · ${s.q.ro} · ${s.q.bloom}`),
        h("td", {class:"num"}, fmt2(s.p)), h("td", {class:"num"}, fmt2(s.d)), h("td", {class:"num"}, `${pct(s.cw)}%`),
        h("td", {class:"num"}, s.tmed == null ? "—" : Math.round(s.tmed) + (s.fast ? ` (${s.fast} < 5 с)` : "")), h("td", null, flags(s))))))),
    h("h3", null, "Анализ вариантов ответа"),
    h("p", {class:"hint"}, "Какие варианты выбирают студенты. Неверный вариант, который выбирают меньше 5%, не работает: замените его правдоподобным."),
    stats.map(s => distractors(s, first)));
}

function distractors(s, first){
  const q = s.q, resp = first.map(t => t.resp ? t.resp[q.id] : undefined).filter(v => v !== undefined), n = resp.length;
  const body = h("div", {class:"dist"});
  if (!n) body.append(h("div", {class:"hint"}, "Нет сохранённых ответов."));
  else if (q.type === "single" || q.type === "case" || q.type === "multi"){
    const isOk = k => q.type === "multi" ? q.correct.includes(k) : q.correct === k;
    q.opts.forEach(([k, t]) => { const c = resp.filter(r => Array.isArray(r) ? r.includes(k) : r === k).length, share = c / n;
      body.append(barRow(h("span", {class: isOk(k) ? "ok" : share < .05 ? "dead" : null}, (isOk(k) ? "✓ " : share < .05 ? "не работает · " : "") + t), null, share)); });
  } else if (q.type === "hotspot"){
    const cnt = {}; resp.forEach(r => cnt[r] = (cnt[r] || 0) + 1);
    (FIGZONES[q.fig || "infra"]).filter(z => cnt[z] || z === q.correct).forEach(z => body.append(barRow(h("span", {class: z === q.correct ? "ok" : null}, (z === q.correct ? "✓ " : "") + ZONES[z]), null, (cnt[z] || 0) / n)));
  } else if (q.type === "match"){
    q.items.forEach(([t, a], j) => { const wrong = {}; let ok = 0; resp.forEach(r => { const v = r && r[j]; if (v === a) ok++; else if (v) wrong[v] = (wrong[v] || 0) + 1; });
      const top = Object.entries(wrong).sort((x, y) => y[1] - x[1])[0];
      body.append(barRow(`${t} → ${a}` + (top ? ` · чаще всего путают с «${top[0]}» (${pct(top[1] / n)}%)` : ""), null, ok / n)); });
  } else if (q.type === "order"){
    const full = resp.filter(r => Array.isArray(r) && r.every((v, pos) => v === pos)).length;
    body.append(barRow("Полностью верная последовательность", null, full / n));
    q.items.forEach((t, idx) => { const okPos = resp.filter(r => Array.isArray(r) && r[idx] === idx).length; body.append(barRow(`На своём месте: ${t}`, null, okPos / n)); });
  }
  return h("details", null, h("summary", null, `№${s.j + 1}. ${q.q.length > 90 ? q.q.slice(0, 90) + "…" : q.q}`), body);
}

function studentsCard(bySid, pass){
  const rows = Object.entries(bySid).map(([sid, tr]) => ({sid, tr, name: (an.names[sid] && an.names[sid].name) || "Студент", best: Math.max(...tr.map(t => t.score)), last: tr[tr.length - 1]}))
    .sort((a, b) => a.name.localeCompare(b.name, "ru"));
  return h("div", {class:"card"}, h("h2", null, "Студенты"),
    h("div", {class:"tbl"}, h("table", null,
      h("thead", null, h("tr", null, h("th", null, "Студент"), h("th", null, "Вуз · группа"), h("th", {class:"num"}, "Попыток"), h("th", {class:"num"}, "Первая"), h("th", {class:"num"}, "Лучшая"), h("th", {class:"num"}, "Уверенность"), h("th", null, "Последняя"))),
      h("tbody", null, rows.map(r => h("tr", null, h("td", null, r.name), h("td", null, [r.last.uni, r.last.group].filter(Boolean).join(" · ") || "—"),
        h("td", {class:"num"}, r.tr.length), h("td", {class:"num"}, r.tr[0].score + "%"), h("td", {class:"num"}, h("span", {class: r.best >= pass ? null : "dead"}, r.best + "%")),
        h("td", {class:"num"}, fmt1(r.tr[0].cbm || 0)), h("td", null, new Date(r.last.at).toLocaleString("ru-RU", {dateStyle:"short", timeStyle:"short"}))))))));
}

function angoffCard(ch, cfg, stats, box){
  const qs = BANK[ch], vals = Object.assign({}, cfg.angoff || {});
  const out = h("strong", {style:"font-family:var(--mono)"});
  const calc = () => { const v = qs.map(q => vals[q.id]).filter(x => typeof x === "number"); out.textContent = v.length === qs.length ? `${Math.round(mean(v))}%` : `заполнено ${v.length} из ${qs.length}`; return v.length === qs.length ? Math.round(mean(v)) : null; };
  const status = h("span", {class:"hint"});
  const list = h("div", {class:"ang"}, qs.map((q, j) => h("div", {class:"r"}, h("span", {class:"tag"}, j + 1), h("span", null, q.q.length > 110 ? q.q.slice(0, 110) + "…" : q.q),
    h("input", {type:"number", min:"0", max:"100", step:"5", id:`ang-${q.id}`, value: vals[q.id] != null ? vals[q.id] : "", "aria-label":`Задание ${j + 1}, ожидаемый процент`, oninput:e => { const x = parseFloat(e.target.value); if (isNaN(x)) delete vals[q.id]; else vals[q.id] = Math.max(0, Math.min(100, x)); calc(); }}))));
  calc();
  return h("details", {class:"card", style:"padding:16px 20px"},
    h("summary", null, `Проходной балл: ${cfg.pass}%` + (cfg.method === "angoff" ? " · установлен методом Ангоффа" : " · по умолчанию")),
    h("p", {class:"hint"}, "Метод Ангоффа: для каждого задания укажите, какой процент «минимально подготовленных» студентов, по вашей оценке, выполнит его верно. Среднее по заданиям — обоснованный проходной балл. Надёжнее, если оценки независимо дадут 3–5 преподавателей, а в форму внести их среднее."),
    list,
    h("div", {class:"row"}, h("span", null, "Расчётный проходной балл: ", out), h("span", {class:"spacer"}), status,
      h("button", {class:"btn", onclick: async () => { const p = calc(); if (p == null){ status.textContent = "Заполните оценки для всех заданий."; return; }
        try { await withTimeout(db.doc("config/ch" + ch).set({pass: p, angoff: vals, method: "angoff", at: new Date().toISOString()}), 10000); config[ch] = {pass: p, angoff: vals, method: "angoff"}; drawAnalytics(box, config[ch]); }
        catch(e){ status.textContent = "Не удалось сохранить. Попробуйте ещё раз."; } }}, "Сохранить проходной балл")));
}

async function exportCsv(ch, tries){
  const qs = BANK[ch], esc = v => { const s = String(v == null ? "" : v); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const head = ["Студент","Вуз","Группа","Режим","Дата","Результат, %","Балл уверенности", ...qs.map((q, j) => `Задание ${j + 1} (${q.ro}, Блум ${q.bloom})`), ...qs.map((q, j) => `Уверенность ${j + 1}`)];
  const rows = tries.slice().sort((a, b) => a.at < b.at ? -1 : 1).map(t => [(an.names[t.sid] && an.names[t.sid].name) || "Студент", t.uni, t.group, MODES[t.mode] || t.mode,
    new Date(t.at).toLocaleString("ru-RU"), t.score, String(t.cbm || 0).replace(".", ","), ...qs.map(q => t.items && t.items[q.id] != null ? String(t.items[q.id]).replace(".", ",") : ""), ...qs.map(q => (t.conf && t.conf[q.id]) || "")]);
  const csv = "﻿" + [head, ...rows].map(r => r.map(esc).join(";")).join("\r\n");
  if (!downloads){ alertBox("Выгрузка недоступна в этом окне. Откройте тренажёр в браузере на claude.ai."); return; }
  try { await downloads.save({filename: `trener-glava-${ch}-${new Date().toISOString().slice(0, 10)}.csv`, data: csv}); }
  catch(e){ if (e && e.code !== "cancelled" && e.code !== "declined") alertBox("Файл не сохранён. Попробуйте ещё раз."); }
}
function alertBox(msg){ const n = h("div", {class:"note", role:"status"}, msg); app.prepend(n); window.scrollTo(0, 0); setTimeout(() => n.remove(), 6000); }

render();
})();
</script>
